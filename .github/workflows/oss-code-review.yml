name: oss-code-review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'review:code'
    permissions:
      contents: read
      pull-requests: write
    uses: ChaoyuWang04/oss-kit/.github/workflows/code-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
